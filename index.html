<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상공간 특별수사대 - 신호등 타이머 센터</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl font-bold shadow">
                <i class="fa-solid fa-traffic-light text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">가상공간 특별수사대 - 신호등 타이머 센터</h1>
                <p class="text-xs text-slate-400">도덕 의리T 제작 - 대형 신호등 타이머 및 활동 안내 관리</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span class="px-3 py-1 bg-indigo-900 text-indigo-300 rounded-full text-xs font-semibold">교사 관리자 모드</span>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col items-center justify-center space-y-8">
        
        <!-- Horizontal/Vertical Traffic Light Visual Panel -->
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-2xl flex flex-col items-center space-y-6 w-full max-w-2xl">
            
            <div class="w-full flex justify-between items-center">
                <div class="space-y-1">
                    <span class="text-sm font-bold text-slate-300 uppercase tracking-widest">현재 활동 신호등 상태</span>
                    <div id="current-mode-label" class="text-3xl font-extrabold text-emerald-400 tracking-wide">🟢 추리중 모드</div>
                </div>
                <!-- Layout Direction Toggle Buttons -->
                <div class="flex bg-slate-900 p-1.5 rounded-2xl border border-slate-700 space-x-1">
                    <button onclick="window.setTrafficLightLayout('horizontal')" id="layout-btn-horizontal" class="px-3 py-1.5 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow">
                        <i class="fa-solid fa-ellipsis"></i> 가로
                    </button>
                    <button onclick="window.setTrafficLightLayout('vertical')" id="layout-btn-vertical" class="px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">
                        <i class="fa-solid fa-ellipsis-vertical"></i> 세로
                    </button>
                </div>
            </div>

            <!-- Huge Traffic Light Housing (Dynamic Flex Container) -->
            <div id="traffic-light-housing" class="bg-slate-950 px-8 py-6 rounded-3xl border-4 border-slate-700 flex flex-row items-center justify-center space-x-8 shadow-2xl transition-all duration-300">
                
                <!-- Green Bulb (추리중) -->
                <button onclick="window.setTrafficLightMode('추리중')" title="추리중 모드로 전환 (초록불)" 
                        id="bulb-green" class="w-24 h-24 rounded-full bg-emerald-950 border-4 border-emerald-500/40 transition transform hover:scale-105 cursor-pointer flex items-center justify-center shadow-2xl shrink-0">
                    <div id="bulb-green-inner" class="w-16 h-16 rounded-full bg-emerald-900 transition-all duration-300"></div>
                </button>

                <!-- Yellow Bulb (단서획득중) -->
                <button onclick="window.setTrafficLightMode('단서획득중')" title="단서획득중 모드로 전환 (노란불)" 
                        id="bulb-yellow" class="w-24 h-24 rounded-full bg-amber-950 border-4 border-amber-500/40 transition transform hover:scale-105 cursor-pointer flex items-center justify-center shadow-2xl shrink-0">
                    <div id="bulb-yellow-inner" class="w-16 h-16 rounded-full bg-amber-900 transition-all duration-300"></div>
                </button>

                <!-- Red Bulb (회의중) -->
                <button onclick="window.setTrafficLightMode('회의중')" title="회의중 모드로 전환 (빨간불)" 
                        id="bulb-red" class="w-24 h-24 rounded-full bg-red-950 border-4 border-red-500/40 transition transform hover:scale-105 cursor-pointer flex items-center justify-center shadow-2xl shrink-0">
                    <div id="bulb-red-inner" class="w-16 h-16 rounded-full bg-red-900 transition-all duration-300"></div>
                </button>

            </div>

            <p class="text-xs text-slate-400 text-center italic">
                * 신호등 동그라미를 클릭하면 모드가 전환되며, 상단 버튼으로 가로/세로 배치를 바꿀 수 있습니다.
            </p>
        </div>

        <!-- Timer & Controls Panel -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl shadow-xl w-full max-w-2xl flex flex-col space-y-6">
            
            <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-slate-300 uppercase tracking-wider">수사 제한 타이머</span>
                <div id="signal-badge" class="px-4 py-2 bg-emerald-950/90 text-emerald-300 border border-emerald-500/50 rounded-full text-xs font-bold flex items-center space-x-2.5 shadow-md">
                    <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
                    <span id="signal-text" class="tracking-wide">추리중</span>
                </div>
            </div>

            <!-- Big Timer Display -->
            <div id="timer-display" class="text-6xl font-mono font-black text-cyan-400 bg-slate-900 py-6 rounded-2xl border border-slate-700 text-center shadow-inner tracking-wider">
                05:00
            </div>

            <!-- Timer Action Buttons -->
            <div class="grid grid-cols-3 gap-3">
                <button onclick="window.startTimer()" class="py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white transition shadow cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i><span>시작</span>
                </button>
                <button onclick="window.pauseTimer()" class="py-3 bg-amber-600 hover:bg-amber-500 rounded-xl font-bold text-white transition shadow cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-pause"></i><span>일시정지</span>
                </button>
                <button onclick="window.resetTimer()" class="py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-slate-300 transition shadow cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-right"></i><span>초기화</span>
                </button>
            </div>

            <!-- Timer Preset Setting -->
            <div class="pt-4 border-t border-slate-700 flex items-center space-x-3">
                <span class="text-xs font-semibold text-slate-400 whitespace-nowrap">시간 설정 (분):</span>
                <input type="number" id="timer-input-min" value="5" min="1" max="60" class="w-24 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-center text-white font-bold text-sm outline-none focus:border-indigo-500">
                <button onclick="window.setTimerMinutes()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl font-bold text-white text-xs transition shadow cursor-pointer">
                    시간 적용하기
                </button>
            </div>

        </div>

    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-400">
        도덕 의리T 제작 - 신호등 타이머 센터
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4qzfQdEBQlvMCpjCP9py0fg99ZKeyyGM",
            authDomain: "edu-2026-d000a.firebaseapp.com",
            projectId: "edu-2026-d000a",
            storageBucket: "edu-2026-d000a.firebasestorage.app",
            messagingSenderId: "951588476004",
            appId: "1:951588476004:web:e86a6e37a02e1cb9a3fb71"
        };

        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'special-investigation-timer-v1';

        let localState = {
            timer: {
                remainingSeconds: 300,
                isRunning: false,
                mode: "추리중",
                layout: "horizontal"
            }
        };

        let gameDocRef = null;

        async function initApp() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);
                gameDocRef = doc(db, 'artifacts', appId);
                
                try {
                    const docSnap = await getDoc(gameDocRef);
                    if (!docSnap.exists()) {
                        await setDoc(gameDocRef, localState);
                    } else {
                        const data = docSnap.data();
                        if (data.timer) localState.timer = data.timer;
                    }
                } catch (fetchErr) {
                    console.warn("Offline or document fetch warning, using local state:", fetchErr);
                }

                renderDashboard();

                try {
                    onSnapshot(gameDocRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.timer) {
                                localState.timer = data.timer;
                                renderDashboard();
                            }
                        }
                    });
                } catch (snapErr) {
                    console.warn("Snapshot listener setup warning:", snapErr);
                }

            } catch (err) {
                console.warn("Initialization fallback to local mode:", err);
                renderDashboard();
            }

            // Local Timer Tick Loop
            setInterval(() => {
                if (localState.timer && localState.timer.isRunning && localState.timer.remainingSeconds > 0) {
                    localState.timer.remainingSeconds--;
                    if (localState.timer.remainingSeconds <= 0) {
                        localState.timer.isRunning = false;
                    }
                    updateTimerDisplay();
                }
            }, 1000);
        }

        window.renderDashboard = function() {
            updateTimerDisplay();

            const badge = document.getElementById('signal-badge');
            const signalText = document.getElementById('signal-text');
            const modeLabel = document.getElementById('current-mode-label');
            const bulbRedInner = document.getElementById('bulb-red-inner');
            const bulbYellowInner = document.getElementById('bulb-yellow-inner');
            const bulbGreenInner = document.getElementById('bulb-green-inner');
            const housing = document.getElementById('traffic-light-housing');
            const btnH = document.getElementById('layout-btn-horizontal');
            const btnV = document.getElementById('layout-btn-vertical');

            const currentMode = localState.timer?.mode || "추리중";
            const currentLayout = localState.timer?.layout || "horizontal";

            if (signalText) signalText.innerText = currentMode;

            // Apply layout styling
            if (housing) {
                if (currentLayout === 'vertical') {
                    housing.className = "bg-slate-950 px-6 py-8 rounded-3xl border-4 border-slate-700 flex flex-col items-center justify-center space-y-6 shadow-2xl transition-all duration-300";
                    if (btnV) btnV.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow";
                    if (btnH) btnH.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white";
                } else {
                    housing.className = "bg-slate-950 px-8 py-6 rounded-3xl border-4 border-slate-700 flex flex-row items-center justify-center space-x-8 shadow-2xl transition-all duration-300";
                    if (btnH) btnH.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow";
                    if (btnV) btnV.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white";
                }
            }

            // Reset bulb glows
            if (bulbRedInner) bulbRedInner.className = "w-16 h-16 rounded-full bg-red-950";
            if (bulbYellowInner) bulbYellowInner.className = "w-16 h-16 rounded-full bg-amber-950";
            if (bulbGreenInner) bulbGreenInner.className = "w-16 h-16 rounded-full bg-emerald-950";

            if (currentMode === '회의중') {
                if (badge) {
                    badge.className = "px-4 py-2 bg-red-950/90 text-red-300 border border-red-500/50 rounded-full text-xs font-bold flex items-center space-x-2.5 shadow-md";
                    badge.innerHTML = `<span class="w-3 h-3 rounded-full bg-red-400 animate-pulse shrink-0"></span><span class="tracking-wide">회의중</span>`;
                }
                if (modeLabel) {
                    modeLabel.innerText = "🔴 회의중 모드";
                    modeLabel.className = "text-3xl font-extrabold text-red-400 tracking-wide";
                }
                if (bulbRedInner) bulbRedInner.className = "w-16 h-16 rounded-full bg-red-500 shadow-[0_0_35px_rgba(239,68,68,0.9)] animate-pulse";
            } else if (currentMode === '단서획득중') {
                if (badge) {
                    badge.className = "px-4 py-2 bg-amber-950/90 text-amber-300 border border-amber-500/50 rounded-full text-xs font-bold flex items-center space-x-2.5 shadow-md";
                    badge.innerHTML = `<span class="w-3 h-3 rounded-full bg-amber-400 animate-pulse shrink-0"></span><span class="tracking-wide">단서획득중</span>`;
                }
                if (modeLabel) {
                    modeLabel.innerText = "🟡 단서획득중 모드";
                    modeLabel.className = "text-3xl font-extrabold text-amber-400 tracking-wide";
                }
                if (bulbYellowInner) bulbYellowInner.className = "w-16 h-16 rounded-full bg-amber-400 shadow-[0_0_35px_rgba(245,158,11,0.9)] animate-pulse";
            } else {
                if (badge) {
                    badge.className = "px-4 py-2 bg-emerald-950/90 text-emerald-300 border border-emerald-500/50 rounded-full text-xs font-bold flex items-center space-x-2.5 shadow-md";
                    badge.innerHTML = `<span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse shrink-0"></span><span class="tracking-wide">추리중</span>`;
                }
                if (modeLabel) {
                    modeLabel.innerText = "🟢 추리중 모드";
                    modeLabel.className = "text-3xl font-extrabold text-emerald-400 tracking-wide";
                }
                if (bulbGreenInner) bulbGreenInner.className = "w-16 h-16 rounded-full bg-emerald-400 shadow-[0_0_35px_rgba(16,185,129,0.9)] animate-pulse";
            }
        };

        function updateTimerDisplay() {
            const display = document.getElementById('timer-display');
            if (!display || !localState.timer) return;
            const totalSec = localState.timer.remainingSeconds || 0;
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        window.setTrafficLightMode = async function(mode) {
            localState.timer.mode = mode;
            renderDashboard();
            await saveTimerStateToFirebase();
        };

        window.setTrafficLightLayout = async function(layout) {
            localState.timer.layout = layout;
            renderDashboard();
            await saveTimerStateToFirebase();
        };

        window.setTimerMinutes = async function() {
            const input = document.getElementById('timer-input-min');
            const mins = parseInt(input.value) || 5;
            localState.timer.remainingSeconds = mins * 60;
            localState.timer.isRunning = false;
            updateTimerDisplay();
            await saveTimerStateToFirebase();
        };

        window.startTimer = async function() {
            localState.timer.isRunning = true;
            await saveTimerStateToFirebase();
        };

        window.pauseTimer = async function() {
            localState.timer.isRunning = false;
            await saveTimerStateToFirebase();
        };

        window.resetTimer = async function() {
            const input = document.getElementById('timer-input-min');
            const mins = parseInt(input.value) || 5;
            localState.timer.remainingSeconds = mins * 60;
            localState.timer.isRunning = false;
            updateTimerDisplay();
            await saveTimerStateToFirebase();
        };

        async function saveTimerStateToFirebase() {
            if (gameDocRef) {
                try {
                    await setDoc(gameDocRef, { timer: localState.timer }, { merge: true });
                } catch (err) {
                    console.error("Failed to update timer:", err);
                }
            }
        }

        initApp();
    </script>
</body>
</html>
