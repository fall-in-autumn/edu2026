<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상공간 특별수사대 - 교사 관리 센터</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .draggable-token { cursor: grab; }
        .draggable-token:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl font-bold shadow">
                <i class="fa-solid fa-chalkboard-user text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">가상공간 특별수사대 - 교사 관리 센터</h1>
                <p class="text-xs text-slate-400">도덕 의리T 제작 - 모둠별 수사 위치 보드 관리</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span class="px-3 py-1 bg-indigo-900 text-indigo-300 rounded-full text-xs font-semibold">교사 관리자 모드</span>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Status & Instructions Banner -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center shadow">
            <div>
                <h3 class="font-bold text-lg text-indigo-300"><i class="fa-solid fa-map mr-2"></i>수사 위치 보드 (드래그 앤 드롭)</h3>
                <p class="text-xs text-slate-400">모둠 카드를 다른 가상공간 상자로 드래그하여 위치를 이동시키세요.</p>
            </div>
            <button onclick="window.resetLocations()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs font-semibold text-slate-300 transition cursor-pointer">
                <i class="fa-solid fa-rotate-right mr-1"></i> 위치 초기화 (시작점)
            </button>
        </div>

        <!-- Locations Grid (Drop Targets) - Full Width Grid including 시작점 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4" id="board-locations-grid">
            <!-- Dynamically populated -->
        </div>

    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-400">
        도덕 의리T 제작 - 교사 관리 대시보드
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4qzfQdEBQlvMCpjCP9py0fg99ZKeyyGM",
            authDomain: "edu-2026-d000a.firebaseapp.com",
            projectId: "edu-2026-d000a",
            storageBucket: "edu-2026-d000a.firebasestorage.app",
            messagingSenderId: "951588476004",
            appId: "1:951588476004:web:e86a6e37a02e1cb9a3fb71"
        };

        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'special-investigation-room-v7';

        const places = [
            { name: "시작점", icon: "fa-flag-checkered" },
            { name: "SNS", icon: "fa-share-nodes" },
            { name: "유튜브", icon: "fa-video" },
            { name: "게임", icon: "fa-gamepad" },
            { name: "OTT", icon: "fa-film" },
            { name: "Zoom", icon: "fa-tv" }
        ];

        const groupColors = {
            1: { name: "1모둠", bg: "bg-red-500" },
            2: { name: "2모둠", bg: "bg-blue-500" },
            3: { name: "3모둠", bg: "bg-emerald-500" },
            4: { name: "4모둠", bg: "bg-amber-500" },
            5: { name: "5모둠", bg: "bg-purple-500" }
        };

        let localState = {
            locations: {
                "시작점": [1, 2, 3, 4, 5],
                "SNS": [],
                "유튜브": [],
                "게임": [],
                "OTT": [],
                "Zoom": []
            }
        };

        let gameDocRef = null;

        async function initApp() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);
                gameDocRef = doc(db, 'artifacts', appId);
                
                try {
                    const docSnap = await getDoc(gameDocRef);
                    if (!docSnap.exists()) {
                        await setDoc(gameDocRef, localState);
                    } else {
                        const data = docSnap.data();
                        if (data.locations) localState.locations = data.locations;
                    }
                } catch (fetchErr) {
                    console.warn("Offline or document fetch warning, using local state:", fetchErr);
                }

                renderDashboard();

                try {
                    onSnapshot(gameDocRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.locations) {
                                localState.locations = data.locations;
                                renderDashboard();
                            }
                        }
                    });
                } catch (snapErr) {
                    console.warn("Snapshot listener setup warning:", snapErr);
                }

            } catch (err) {
                console.warn("Initialization fallback to local mode:", err);
                renderDashboard();
            }
        }

        window.renderDashboard = function() {
            const grid = document.getElementById('board-locations-grid');
            if (!grid) return;
            grid.innerHTML = '';

            places.forEach(placeObj => {
                const locName = placeObj.name;
                const groupsHere = localState.locations[locName] || [];

                let tokensHtml = groupsHere.map(gId => {
                    const info = groupColors[gId];
                    return `
                        <div draggable="true" ondragstart="window.handleDragStart(event, ${gId})" 
                             class="draggable-token px-3 py-2 rounded-xl text-xs font-bold text-white shadow-md flex items-center justify-between ${info.bg} cursor-grab active:cursor-grabbing">
                            <span><i class="fa-solid fa-users mr-1"></i>${info.name}</span>
                            <i class="fa-solid fa-grip-vertical text-white/70 ml-1"></i>
                        </div>
                    `;
                }).join('');

                grid.innerHTML += `
                    <div ondragover="window.handleDragOver(event)" ondragleave="window.handleDragLeave(event)" ondrop="window.handleDrop(event, '${locName}')"
                         class="bg-slate-900 border-2 border-dashed border-slate-700 hover:border-indigo-500 transition p-3 rounded-2xl flex flex-col justify-between space-y-3 min-h-[260px] shadow-inner">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <span class="font-bold text-slate-200 flex items-center text-sm">
                                <i class="fa-solid ${placeObj.icon} text-indigo-400 mr-2"></i>${locName}
                            </span>
                        </div>
                        <div class="flex flex-col gap-2.5 flex-1 justify-start">
                            ${tokensHtml || '<div class="flex-1 flex items-center justify-center text-xs text-slate-600 italic text-center p-4">모둠 말을 이곳으로 드래그하세요</div>'}
                        </div>
                    </div>
                `;
            });
        };

        let draggedGroupId = null;

        window.handleDragStart = function(e, gId) {
            draggedGroupId = gId;
            e.dataTransfer.setData('text/plain', gId);
        };

        window.handleDragOver = function(e) {
            e.preventDefault();
            e.currentTarget.classList.add('border-indigo-400', 'bg-slate-800/80');
        };

        window.handleDragLeave = function(e) {
            e.currentTarget.classList.remove('border-indigo-400', 'bg-slate-800/80');
        };

        window.handleDrop = async function(e, targetLoc) {
            e.preventDefault();
            e.currentTarget.classList.remove('border-indigo-400', 'bg-slate-800/80');
            
            if (!draggedGroupId) return;
            const gId = parseInt(draggedGroupId);

            let newLocations = JSON.parse(JSON.stringify(localState.locations));

            for (let l in newLocations) {
                newLocations[l] = newLocations[l].filter(id => id !== gId);
            }

            if (!newLocations[targetLoc]) {
                newLocations[targetLoc] = [];
            }
            newLocations[targetLoc].push(gId);

            localState.locations = newLocations;
            renderDashboard();

            if (gameDocRef) {
                try {
                    await setDoc(gameDocRef, { locations: newLocations }, { merge: true });
                } catch (err) {
                    console.error("Failed to update location via drop:", err);
                }
            }

            draggedGroupId = null;
        };

        window.resetLocations = async function() {
            let resetLocs = {
                "시작점": [1, 2, 3, 4, 5],
                "SNS": [],
                "유튜브": [],
                "게임": [],
                "OTT": [],
                "Zoom": []
            };
            localState.locations = resetLocs;
            renderDashboard();

            if (gameDocRef) {
                try {
                    await setDoc(gameDocRef, { locations: resetLocs }, { merge: true });
                } catch (err) {
                    console.error("Reset error:", err);
                }
            }
        };

        initApp();
    </script>
</body>
</html>
